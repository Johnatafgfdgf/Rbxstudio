name: Rbx Studio - real Android UI screenshots

on:
  workflow_dispatch:
  push:
    branches: [main, verify/android-menus]
    paths:
      - .github/workflows/real-android-ui-preview.yml
      - android/**
      - native/**
      - studio/**
      - patches/**
      - platform/**
      - scripts/studio_smoke.py
      - scripts/package_apk.py
      - scripts/cargo_android.py
      - scripts/check_preparation.py
      - scripts/prepare.py
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  signing-tools:
    name: Provide SDK tools for local APK verification
    if: github.ref_name == 'verify/android-menus'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Collect official Android build tools
        run: |
          sdkmanager 'build-tools;35.0.0'
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" signing-tools/
          cd signing-tools
          sha256sum apksigner.jar zipalign aapt > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-sdk-35-local-verification
          path: signing-tools
          retention-days: 7

  real-native-ui:
    name: Build genuine GPUI Android app and capture its pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PORT_APP: studio
      PORT_ARCH: x86_64-linux-android
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      STUDIO_APK_VERSION: '0.6.11'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/android'
          cache-on-failure: true
          key: rbxstudio-native-preview-x86-v1
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Verify project and patch integrity
        run: python3 scripts/check_preparation.py
      - name: Verify active Android Studio branding
        run: python3 scripts/check_studio_branding.py
      - name: Verify MCP agent approval policy
        run: |
          rustc --edition=2021 --test tests/mobile_ai_permissions.rs -o /tmp/rbx-mobile-agent-policy
          /tmp/rbx-mobile-agent-policy
      - name: Compile genuine GPUI Studio and local player
        run: python3 scripts/cargo_android.py build --locked -p rbx_android_studio -p rbx_android_player
      - name: Package genuine Android APK
        run: python3 scripts/package_apk.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image inspection dependencies
        run: python3 -m pip install Pillow
      - name: Run original renderer and capture real Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STUDIO_SKIP_RESUME: '1'
          STUDIO_SKIP_SETUP: '1'
          STUDIO_REQUIRE_EDITOR: '1'
          STUDIO_INSPECT_VIEWPORT: ${{ github.ref_name == 'verify/android-menus' && '0' || '1' }}
          STUDIO_COMPACT_LAYOUT: '1'
          STUDIO_CAPTURE_MOBILE_MENUS: ${{ github.ref_name == 'verify/android-menus' && '1' || '0' }}
          STUDIO_APK_VERSION: '0.6.11'
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 3072 -partition-size 2048
          disable-animations: true
          script: python3 scripts/studio_smoke.py
      - name: Bind screenshots to APK and exact source revision
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path("dist/original-studio-test")
          output.mkdir(parents=True, exist_ok=True)
          apks = list(Path("dist").glob("*x86_64-debug.apk"))
          shots = sorted(x.name for x in output.glob("*.png"))
          result = {
              "commit": os.environ["GITHUB_SHA"],
              "apk": [{"name": p.name, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in apks],
              "screenshots": shots,
              "source": "Android emulator screencap from native GPUI APK, not HTML or generated art",
              "not_certified": "Screenshot appearance and touch behavior still require visual review"
          }
          (output / "capture-manifest.json").write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Save APK, screenshots and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbxstudio-native-ui-evidence
          path: |
            dist/*.apk
            dist/original-studio-test/
            logs/
          retention-days: 14
