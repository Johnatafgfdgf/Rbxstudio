name: Recheck a built original Studio APK
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Workflow run containing the original-studio-x86_64-linux-android artifact
        required: true
        default: '41473710579'
permissions:
  contents: read
  actions: read
jobs:
  original-editor-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: original-studio-x86_64-linux-android
          run-id: ${{ inputs.source_run || '41473710579' }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 2048 -partition-size 2048
          disable-animations: true
          script: python3 scripts/studio_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-editor-lifecycle
          path: dist/original-studio-test/
          retention-days: 14
