name: Original Studio Android port
on:
  push:
    branches: [work/rbx-native-android-full-studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 2048 -partition-size 2048
          disable-animations: true
          script: python3 scripts/android_services_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-host-services-validation
          path: logs/android-services/
          retention-days: 14
  core-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: original-studio-resources-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: full-studio-core-resources-v1
      - run: python3 scripts/check_preparation.py
      - run: cargo test --locked -p rbx_android_core --tests
      - name: Run official Studio resources and CoreScripts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          cargo run --locked -p rbx_android_core --example studio_resources -- "$RUNNER_TEMP/studio-resources" 2>&1 | tee logs/official-core-scripts.log
          cargo run --locked -p rbx_android_core --example studio_resources -- "$RUNNER_TEMP/studio-resources" --touch 2>&1 | tee logs/official-mobile-controls.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-resources-validation
          path: logs/
          retention-days: 14
  original-editor-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64-linux-android, x86_64-linux-android]
    concurrency:
      group: original-studio-build-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      PORT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/android'
          cache-on-failure: true
          key: full-original-studio-${{ matrix.arch }}-v2
      - name: Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: python3 scripts/check_preparation.py
      - name: Check Android host services
        run: |
          mkdir -p android/build/classes
          javac --release 11 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d android/build/classes $(find android/src -name '*.java') upstream/gpui-mobile/example/android/gradle/app/src/main/java/dev/gpui/mobile/GpuiClipboard.java upstream/gpui-mobile/example/android/gradle/app/src/main/java/dev/gpui/mobile/GpuiFilePicker.java upstream/gpui-mobile/example/android/gradle/app/src/main/java/dev/gpui/mobile/GpuiPickerActivity.java
      - name: Check complete original editor and Rook render stack
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python3 scripts/cargo_android.py check --locked -p rbx_android_studio -p rbx_android_player 2>&1 | tee logs/original-studio-arm64.log
      - name: Build original editor shared library
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/cargo_android.py build --locked -p rbx_android_studio -p rbx_android_player 2>&1 | tee logs/original-studio-arm64-build.log
      - name: Package development APK
        run: PORT_APP=studio python3 scripts/package_apk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-studio-${{ matrix.arch }}
          path: |
            logs/
            Cargo.lock
            dist/*.apk*
            dist/original-studio-test/
          retention-days: 14
  editor-emulator:
    needs: original-editor-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: original-studio-x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: python3 -m pip install Pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          STUDIO_SKIP_SETUP: '1'
          STUDIO_REQUIRE_EDITOR: '1'
          STUDIO_LIFECYCLE_CYCLES: '3'
          STUDIO_APK_VERSION: '0.6.7'
          STUDIO_PROBE_SIGNIN: '1'
          STUDIO_REQUIRE_LOGIN_READY: '1'
          STUDIO_REQUIRE_LOW_DEFAULT: '1'
          STUDIO_TEST_CAMERA: '1'
          STUDIO_INSPECT_VIEWPORT: '1'
          STUDIO_COMPACT_LAYOUT: '1'
          STUDIO_TEST_PLAY: '1'
          STUDIO_REQUIRE_DEFAULT_AVATAR: '1'
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu lavapipe -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 3072 -partition-size 2048
          disable-animations: true
          script: python3 scripts/studio_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-studio-android-lifecycle
          path: dist/original-studio-test/
          retention-days: 14
