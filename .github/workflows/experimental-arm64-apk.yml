name: Experimental RBX Studio 0.6.11 ARM64 separate-install APK

on:
  push:
    branches: [verify/android-menus, work/ai-autonomous-read-v1]
    paths:
      - .github/workflows/experimental-arm64-apk.yml
      - patches/**
      - android/**
      - core/**
      - native/**
      - player/**
      - studio/**
      - platform/**
      - geometry/**
      - scripts/cargo_android.py
      - scripts/package_apk.py
      - scripts/prepare.py
      - scripts/check_preparation.py
      - scripts/check_studio_branding.py
      - scripts/check_ai_hub.py
      - scripts/check_studio_apk.py
      - tests/mobile_ai_permissions.rs
      - Cargo.toml
      - Cargo.lock
      - .gitmodules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build installable Android arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PORT_APP: studio
      PORT_EXPERIMENTAL_PACKAGE: '1'
      PORT_ARCH: aarch64-linux-android
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      STUDIO_APK_VERSION: '0.6.11'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/android'
          cache-on-failure: true
          key: rbxstudio-experimental-0611-arm64
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Verify original source and patch integrity
        run: python3 scripts/check_preparation.py
      - name: Verify active Android Studio branding
        run: python3 scripts/check_studio_branding.py
      - name: Verify real AI hub safety and API contracts
        run: python3 scripts/check_ai_hub.py
      - name: Verify MCP agent approval policy
        run: |
          rustc --edition=2021 --test tests/mobile_ai_permissions.rs -o /tmp/rbx-mobile-agent-policy
          /tmp/rbx-mobile-agent-policy
      - name: Build Android ARM64 Studio and local player
        run: python3 scripts/cargo_android.py build --locked -p rbx_android_studio -p rbx_android_player
      - name: Restore private persistent signing key (optional)
        env:
          RBX_STUDIO_KEYSTORE_B64: ${{ secrets.RBX_STUDIO_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$RBX_STUDIO_KEYSTORE_B64" ]; then
            mkdir -p "$RUNNER_TEMP/rbxstudio-private"
            printf '%s' "$RBX_STUDIO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/rbxstudio-private/signing.jks"
            chmod 600 "$RUNNER_TEMP/rbxstudio-private/signing.jks"
            echo "PORT_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/rbxstudio-private/signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No persistent signing key configured. This test APK may not upgrade an existing installation; export projects before uninstalling."
          fi
      - name: Package signed debug APK
        env:
          PORT_SIGNING_STORE_PASS: ${{ secrets.RBX_STUDIO_ANDROID_STORE_PASS }}
          PORT_SIGNING_KEY_PASS: ${{ secrets.RBX_STUDIO_ANDROID_KEY_PASS }}
          PORT_SIGNING_KEY_ALIAS: ${{ secrets.RBX_STUDIO_ANDROID_KEY_ALIAS }}
        run: python3 scripts/package_apk.py
      - name: Inspect built APK for old UI classes and branding
        run: python3 scripts/check_studio_apk.py
      - name: Verify ARM64 ABI, signature and checksum
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p = Path("dist/rbx-studio-android-0.6.11-arm64-v8a-experimental-debug.apk")
          assert p.exists(), f"Missing APK: {p}"
          with ZipFile(p) as apk:
              libs = [name for name in apk.namelist() if name.startswith("lib/")]
              assert "lib/arm64-v8a/librbx_android_studio.so" in libs, libs
              assert "lib/arm64-v8a/librbx_android_player.so" in libs, libs
              assert not any(name.startswith("lib/x86_64/") for name in libs), libs
          from subprocess import check_output
          badging = check_output([str(Path(__import__("os").environ["ANDROID_HOME"]) / "build-tools/35.0.0/aapt"), "dump", "badging", str(p)], text=True)
          assert "package: name=\'com.rbxnative.androidport.experimental\'" in badging, badging[:300]
          print("Standalone experimental ARM64 APK verified; SHA256", hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Upload ARM64 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbxstudio-0.6.11-arm64-v8a-separate-install
          path: |
            dist/*arm64-v8a*debug.apk
            dist/*arm64-v8a*debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
