name: Native Android port
on:
  push:
    branches: [work/rbx-native-android-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_CODEGEN_UNITS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: runtime-03-x86-rgba-v1
      - run: python3 scripts/prepare.py
      - run: cargo test --locked -p rbx_android_core --tests
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/android'
          cache-on-failure: true
          key: runtime-03-x86-rgba-v1
      - name: Android tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: python3 scripts/prepare.py
      - run: python3 scripts/cargo_android.py build --locked -p rbx_android
      - run: python3 scripts/package_apk.py
      - name: Emulator build
        run: |
          PORT_ARCH=x86_64-linux-android python3 scripts/cargo_android.py build --locked -p rbx_android
          PORT_ARCH=x86_64-linux-android python3 scripts/package_apk.py
      - name: Enable KVM for Android validation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Space for the Android userdata image on the disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost
          df -h /
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 2048 -partition-size 2048
          disable-animations: true
          script: python3 scripts/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: rbx-native-android-arm64-debug
          path: |
            dist/*.apk*
            dist/android-test/
          retention-days: 7

